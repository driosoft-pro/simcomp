services:

  # =========================
  # DATABASES
  # =========================

  db-auth:
    image: deytonro/simcomp-auth-db:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-personas:
    image: deytonro/simcomp-personas-db:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: personas_db
    volumes:
      - personas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-automotores:
    image: deytonro/simcomp-automotores-db:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: automotores_db
    volumes:
      - automotores_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-infracciones:
    image: deytonro/simcomp-infracciones-db:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: infracciones_db
    volumes:
      - infracciones_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-comparendos:
    image: deytonro/simcomp-comparendos-db:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: comparendos_db
    volumes:
      - comparendos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  # =========================
  # MICROSERVICIOS
  # =========================

  ms-auth-service:
    image: deytonro/simcomp-auth-service:latest
    restart: always
    depends_on:
      db-auth:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DB_HOST: db-auth
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - simcomp-net

  ms-personas:
    image: deytonro/simcomp-personas-service:latest
    restart: always
    depends_on:
      db-personas:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      DB_HOST: db-personas
      DB_PORT: 5432
      DB_NAME: personas_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - simcomp-net

  ms-automotores:
    image: deytonro/simcomp-automotores-service:latest
    restart: always
    depends_on:
      db-automotores:
        condition: service_healthy
      ms-personas:
        condition: service_started
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DB_HOST: db-automotores
      DB_PORT: 5432
      DB_NAME: automotores_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - simcomp-net

  ms-infracciones:
    image: deytonro/simcomp-infracciones-service:latest
    restart: always
    depends_on:
      db-infracciones:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      DB_HOST: db-infracciones
      DB_PORT: 5432
      DB_NAME: infracciones_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - simcomp-net

  ms-comparendos:
    image: deytonro/simcomp-comparendos-service:latest
    restart: always
    depends_on:
      db-comparendos:
        condition: service_healthy
      ms-personas:
        condition: service_started
      ms-automotores:
        condition: service_started
      ms-infracciones:
        condition: service_started
    ports:
      - "8005:8005"
    environment:
      PORT: 8005
      DB_HOST: db-comparendos
      DB_PORT: 5432
      DB_NAME: comparendos_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://ms-infracciones:8004
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - simcomp-net

  ms-reportes:
    image: deytonro/simcomp-reportes-service:latest
    restart: always
    depends_on:
      ms-auth-service:
        condition: service_started
      ms-personas:
        condition: service_started
      ms-automotores:
        condition: service_started
      ms-infracciones:
        condition: service_started
      ms-comparendos:
        condition: service_started
    ports:
      - "8006:8006"
    environment:
      PORT: 8006
      AUTH_SERVICE_URL: http://ms-auth-service:8001
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://ms-infracciones:8004
      COMPARENDOS_SERVICE_URL: http://ms-comparendos:8005
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - simcomp-net

  # =========================
  # GATEWAY (NGINX)
  # =========================

  gateway1:
    image: deytonro/simcomp-gateway:latest
    restart: always
    depends_on:
      ms-auth-service:
        condition: service_started
      ms-personas:
        condition: service_started
      ms-automotores:
        condition: service_started
      ms-infracciones:
        condition: service_started
      ms-comparendos:
        condition: service_started
      ms-reportes:
        condition: service_started
    expose:
      - "80"
    networks:
      - simcomp-net

  gateway2:
    image: deytonro/simcomp-gateway:latest
    restart: always
    depends_on:
      ms-auth-service:
        condition: service_started
      ms-personas:
        condition: service_started
      ms-automotores:
        condition: service_started
      ms-infracciones:
        condition: service_started
      ms-comparendos:
        condition: service_started
      ms-reportes:
        condition: service_started
    expose:
      - "80"
    networks:
      - simcomp-net

  # =========================
  # LOAD BALANCER (HAPROXY)
  # =========================

  haproxy:
    image: deytonro/simcomp-haproxy-balance:latest
    ports:
      - "8080:8080"
      - "8404:8404"
    depends_on:
      gateway1:
        condition: service_started
      gateway2:
        condition: service_started
    networks:
      - simcomp-net

  # =========================
  # FRONTEND
  # =========================

  frontend1:
    image: deytonro/simcomp-frontend:latest
    restart: unless-stopped
    networks:
      - simcomp-net

  frontend2:
    image: deytonro/simcomp-frontend:latest
    restart: unless-stopped
    networks:
      - simcomp-net

networks:
  simcomp-net:
    driver: bridge

volumes:
  auth_db_data:
  personas_db_data:
  automotores_db_data:
  infracciones_db_data:
  comparendos_db_data:
