# =====================================================================
# GLOBAL
# =====================================================================
global
    log stdout format raw local0
    maxconn 20000
    # Optimización de SSL (si se usara) y buffers
    tune.ssl.default-dh-param 2048
    nbthread 4

# =====================================================================
# DEFAULTS
# =====================================================================
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-keep-alive 10s
    timeout http-request 5s
    
    # Compresión para ahorrar ancho de banda y mejorar tiempos de carga
    compression algo gzip
    compression type text/html text/plain text/css text/javascript application/javascript application/json

# =====================================================================
# DNS SWARM
# =====================================================================
resolvers docker_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    accepted_payload_size 8192

# =====================================================================
# STATS (PROTEGIDO)
# =====================================================================
frontend stats_front
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 2s
    stats show-legends
    stats show-node
    stats auth admin:Admin123*

# =====================================================================
# FRONTEND PRINCIPAL (ENTRYPOINT ÚNICO)
# =====================================================================
frontend simcomp_front
    bind *:80
    
    # Limitar conexiones por IP para evitar saturación accidental
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    # http-request deny status 429 if { sc0_http_req_rate(10s) gt 500 }

    # -----------------------------
    # CORS GLOBAL
    # -----------------------------
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    http-response set-header Access-Control-Allow-Headers "Authorization, Content-Type"
    http-response set-header Access-Control-Max-Age "3600"

    acl is_options method OPTIONS
    http-request return status 204 if is_options

    # -----------------------------
    # SEGURIDAD: Bloquear endpoints internos
    # -----------------------------
    acl path_internal    path_sub /internal/
    http-request deny if path_internal

    # -----------------------------
    # ACLs (ROUTING REAL)
    # -----------------------------
    acl path_auth        path_beg /api/auth /api/login /api/usuarios
    acl path_personas    path_beg /api/personas /api/licencias
    acl path_auto        path_beg /api/automotores
    acl path_infra       path_beg /api/infracciones
    acl path_comp        path_beg /api/comparendos
    acl path_reportes    path_beg /api/reportes

    # -----------------------------
    # ROUTING
    # -----------------------------
    use_backend auth_back         if path_auth
    use_backend personas_back     if path_personas
    use_backend automotores_back  if path_auto
    use_backend infracciones_back if path_infra
    use_backend comparendos_back  if path_comp
    use_backend reportes_back     if path_reportes

    default_backend frontend_back

# =====================================================================
# BACKENDS (USANDO LEASTCONN PARA MEJOR DISTRIBUCIÓN)
# =====================================================================

backend frontend_back
    balance leastconn
    option httpchk GET /
    http-check expect status 200
    # Resolución dinámica de réplicas en el enjambre
    server-template frontend 2 tasks.simcomp_frontend:80 check resolvers docker_dns init-addr none
    # Servidor de backup estático (Failover)
    server frontend_backup backup_frontend:80 check backup resolvers docker_dns

backend auth_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template auth 10 tasks.simcomp_ms-auth-service:8001 check resolvers docker_dns init-addr none
    server auth_backup backup_auth:8001 check backup resolvers docker_dns

backend personas_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template personas 10 tasks.simcomp_ms-personas:8002 check resolvers docker_dns init-addr none
    server personas_backup backup_personas:8002 check backup resolvers docker_dns

backend automotores_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template automotores 10 tasks.simcomp_ms-automotores:8003 check resolvers docker_dns init-addr none
    server auto_backup backup_auto:8003 check backup resolvers docker_dns

backend infracciones_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template infracciones 10 tasks.simcomp_ms-infracciones:8004 check resolvers docker_dns init-addr none
    server infra_backup backup_infra:8004 check backup resolvers docker_dns

backend comparendos_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template comparendos 10 tasks.simcomp_ms-comparendos:8005 check resolvers docker_dns init-addr none
    server comp_backup backup_comp:8005 check backup resolvers docker_dns

backend reportes_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template reportes 10 tasks.simcomp_ms-reportes:8006 check resolvers docker_dns init-addr none
    server reportes_backup backup_reportes:8006 check backup resolvers docker_dns

# =====================================================================
# DATABASES FAILOVER (TCP MODE - SWARM)
# =====================================================================

listen db_auth_swarm
    bind *:5433
    mode tcp
    server db_main tasks.simcomp_db-auth:5432 check resolvers docker_dns
    server db_backup backup_db_auth:5432 check backup resolvers docker_dns

listen db_personas_swarm
    bind *:5434
    mode tcp
    server db_main tasks.simcomp_db-personas:5432 check resolvers docker_dns
    server db_backup backup_db_personas:5432 check backup resolvers docker_dns

listen db_automotores_swarm
    bind *:5435
    mode tcp
    server db_main tasks.simcomp_db-automotores:5432 check resolvers docker_dns
    server db_backup backup_db_automotores:5432 check backup resolvers docker_dns

listen db_infracciones_swarm
    bind *:5436
    mode tcp
    server db_main tasks.simcomp_db-infracciones:5432 check resolvers docker_dns
    server db_backup backup_db_infracciones:5432 check backup resolvers docker_dns

listen db_comparendos_swarm
    bind *:5437
    mode tcp
    server db_main tasks.simcomp_db-comparendos:5432 check resolvers docker_dns
    server db_backup backup_db_comparendos:5432 check backup resolvers docker_dns
