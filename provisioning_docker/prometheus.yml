global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'glances'
    dns_sd_configs:
      - names:
          - 'tasks.glances'
        type: 'A'
        port: 61208
    metrics_path: /metrics

  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - 'tasks.node-exporter'
        type: 'A'
        port: 9100

  - job_name: 'haproxy'
    dns_sd_configs:
      - names:
          - 'tasks.haproxy'
        type: 'A'
        port: 8404
    metrics_path: /metrics

  - job_name: 'ms-auth-service'
    dns_sd_configs:
      - names:
          - 'tasks.ms-auth-service'
        type: 'A'
        port: 8001
    metrics_path: /metrics
