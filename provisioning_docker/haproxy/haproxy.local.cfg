# =====================================================================
# CONFIGURACIÓN GLOBAL
# =====================================================================
global
    log stdout format raw local0
    maxconn 4096

# =====================================================================
# CONFIGURACIÓN POR DEFECTO
# =====================================================================
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# =====================================================================
# MONITOREO Y ESTADÍSTICAS
# =====================================================================
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node

# =====================================================================
# FRONTEND PRINCIPAL - ENTRADA DE TRÁFICO
# =====================================================================
frontend http_front
    bind *:8080

    # =====================================================================
    # CORS CONFIGURATION
    # =====================================================================
    # Permitir peticiones desde cualquier origen (CORS)
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    http-response set-header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With"
    http-response set-header Access-Control-Max-Age "3600"

    # Manejar peticiones OPTIONS (Preflight) directamente en el Balanceador
    # Se deben incluir los encabezados CORS en la respuesta inmediata (hdrs)
    acl is_options method OPTIONS
    http-request return status 204 content-type "text/plain" hdr Access-Control-Allow-Origin "*" hdr Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" hdr Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" hdr Access-Control-Max-Age "3600" if is_options

    # =====================================================================
    # ACLs PARA ENRUTAMIENTO (LISTAS DE CONTROL DE ACCESO)
    # =====================================================================
    # Definir reglas basadas en el prefijo de la URL para identificar el destino
    acl is_auth        path_beg /api/auth
    acl is_login       path_beg /api/login
    acl is_usuarios    path_beg /api/usuarios

    acl is_personas    path_beg /api/personas
    acl is_licencias   path_beg /api/licencias
    acl is_auto        path_beg /api/automotores
    acl is_infra       path_beg /api/infracciones
    acl is_comp        path_beg /api/comparendos
    acl is_reportes    path_beg /api/reportes

    # Asignar cada flujo al backend correspondiente basado en las ACLs
    use_backend auth_back         if is_auth || is_login || is_usuarios
    use_backend personas_back     if is_personas || is_licencias
    use_backend automotores_back  if is_auto
    use_backend infracciones_back if is_infra
    use_backend comparendos_back  if is_comp
    use_backend reportes_back     if is_reportes

    # Si no coincide con ninguna ruta de API, redirigir al frontend
    default_backend frontend_back

# =====================================================================
# BACKENDS - DEFINICIÓN DE SERVIDORES DE DESTINO
# =====================================================================

# Backend para la aplicación Frontend (Web)
backend frontend_back
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server frontend1 frontend1:80 check inter 10s rise 2 fall 3
    server frontend2 frontend2:80 check inter 10s rise 2 fall 3

# Backend para el Servicio de Autenticación
backend auth_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server ms-auth-service ms-auth-service:8001 check inter 10s rise 2 fall 3

# Backend para el Servicio de Personas y Licencias
backend personas_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server ms-personas ms-personas:8002 check inter 10s rise 2 fall 3

# Backend para el Servicio de Automotores
backend automotores_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server ms-automotores ms-automotores:8003 check inter 10s rise 2 fall 3

# Backend para el Servicio de Infracciones
backend infracciones_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server ms-infracciones ms-infracciones:8004 check inter 10s rise 2 fall 3

# Backend para el Servicio de Comparendos
backend comparendos_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server ms-comparendos ms-comparendos:8005 check inter 10s rise 2 fall 3

# Backend para el Servicio de Reportes
backend reportes_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server ms-reportes ms-reportes:8006 check inter 10s rise 2 fall 3
