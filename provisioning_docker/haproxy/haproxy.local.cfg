# =====================================================================
# CONFIGURACIÓN GLOBAL (OPTIMIZADA PARA ENTORNO LOCAL/PODMAN)
# =====================================================================
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# =====================================================================
# MONITOREO Y ESTADÍSTICAS
# =====================================================================
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends

# =====================================================================
# FRONTEND PRINCIPAL
# =====================================================================
frontend http_front
    bind *:8080

    # CORS
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    http-response set-header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With"
    
    acl is_options method OPTIONS
    http-request return status 204 content-type "text/plain" if is_options

    # ACLs de Enrutamiento
    acl is_auth        path_beg /api/auth
    acl is_login       path_beg /api/login
    acl is_usuarios    path_beg /api/usuarios
    acl is_personas    path_beg /api/personas
    acl is_licencias   path_beg /api/licencias
    acl is_auto        path_beg /api/automotores
    acl is_infra       path_beg /api/infracciones
    acl is_comp        path_beg /api/comparendos
    acl is_reportes    path_beg /api/reportes

    use_backend auth_back         if is_auth || is_login || is_usuarios
    use_backend personas_back     if is_personas || is_licencias
    use_backend automotores_back  if is_auto
    use_backend infracciones_back if is_infra
    use_backend comparendos_back  if is_comp
    use_backend reportes_back     if is_reportes

    default_backend frontend_back

# =====================================================================
# BACKENDS (CONFIGURACIÓN ESTÁTICA PARA MÁXIMA COMPATIBILIDAD)
# =====================================================================

backend frontend_back
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server f1 frontend1:80 check init-addr last,libc,none
    server f2 frontend2:80 check init-addr last,libc,none

backend auth_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server s1 ms-auth-service:8001 check init-addr last,libc,none

backend personas_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server s1 ms-personas:8002 check init-addr last,libc,none

backend automotores_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server s1 ms-automotores:8003 check init-addr last,libc,none

backend infracciones_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server s1 ms-infracciones:8004 check init-addr last,libc,none

backend comparendos_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server s1 ms-comparendos:8005 check init-addr last,libc,none

backend reportes_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server s1 ms-reportes:8006 check init-addr last,libc,none

# =====================================================================
# BASES DE DATOS (TCP)
# =====================================================================

listen db_auth
    bind *:5433
    mode tcp
    server s1 db-auth:5432 check init-addr last,libc,none

listen db_personas
    bind *:5434
    mode tcp
    server s1 db-personas:5432 check init-addr last,libc,none

listen db_automotores
    bind *:5435
    mode tcp
    server s1 db-automotores:5432 check init-addr last,libc,none

listen db_infracciones
    bind *:5436
    mode tcp
    server s1 db-infracciones:5432 check init-addr last,libc,none

listen db_comparendos
    bind *:5437
    mode tcp
    server s1 db-comparendos:5432 check init-addr last,libc,none
