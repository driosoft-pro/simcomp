global
    log stdout format raw local0
    maxconn 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend simcomp_front
    bind *:80
    default_backend simcomp_frontend_nodes

backend simcomp_frontend_nodes
    balance roundrobin
    option httpchk GET /
    server frontend1 simcomp_frontend:80 check

frontend stats_front
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:Admin123*