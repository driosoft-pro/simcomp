# =====================================================================
# GLOBAL
# =====================================================================
global
    log stdout format raw local0
    maxconn 4096

# =====================================================================
# DEFAULTS
# =====================================================================
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# =====================================================================
# DNS SWARM
# =====================================================================
resolvers docker_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    accepted_payload_size 8192

# =====================================================================
# STATS (PROTEGIDO)
# =====================================================================
frontend stats_front
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:Admin123*

# =====================================================================
# FRONTEND PRINCIPAL (ENTRYPOINT ÚNICO)
# =====================================================================
frontend simcomp_front
    bind *:80

    # -----------------------------
    # CORS GLOBAL
    # -----------------------------
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    http-response set-header Access-Control-Allow-Headers "Authorization, Content-Type"
    http-response set-header Access-Control-Max-Age "3600"

    acl is_options method OPTIONS
    http-request return status 204 if is_options

    # -----------------------------
    # ACLs (ROUTING REAL)
    # -----------------------------
    acl path_auth        path_beg /api/auth /api/login /api/usuarios
    acl path_personas    path_beg /api/personas /api/licencias
    acl path_auto        path_beg /api/automotores
    acl path_infra       path_beg /api/infracciones
    acl path_comp        path_beg /api/comparendos
    acl path_reportes    path_beg /api/reportes

    # -----------------------------
    # ROUTING
    # -----------------------------
    use_backend auth_back         if path_auth
    use_backend personas_back     if path_personas
    use_backend automotores_back  if path_auto
    use_backend infracciones_back if path_infra
    use_backend comparendos_back  if path_comp
    use_backend reportes_back     if path_reportes

    default_backend frontend_back

# =====================================================================
# BACKENDS
# =====================================================================

backend frontend_back
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server-template frontend 1 simcomp_frontend:80 check resolvers docker_dns init-addr last,libc,none

backend auth_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server-template auth 10 simcomp_ms-auth-service:8001 check resolvers docker_dns init-addr last,libc,none

backend personas_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server-template personas 10 simcomp_ms-personas:8002 check resolvers docker_dns init-addr last,libc,none

backend automotores_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server-template automotores 10 simcomp_ms-automotores:8003 check resolvers docker_dns init-addr last,libc,none

backend infracciones_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server-template infracciones 10 simcomp_ms-infracciones:8004 check resolvers docker_dns init-addr last,libc,none

backend comparendos_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server-template comparendos 10 simcomp_ms-comparendos:8005 check resolvers docker_dns init-addr last,libc,none

backend reportes_back
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server-template reportes 10 simcomp_ms-reportes:8006 check resolvers docker_dns init-addr last,libc,none

