global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend simcomp_front
    bind *:8080

    acl is_api path_beg /api
    acl is_auth path_beg /auth

    use_backend gateway_nodes if is_api
    use_backend gateway_nodes if is_auth

    default_backend frontend_nodes

backend frontend_nodes
    balance roundrobin
    option httpchk GET /
    server frontend frontend:80 check

backend gateway_nodes
    balance roundrobin
    option httpchk GET /
    server gateway1 gateway1:80 check
    server gateway2 gateway2:80 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:Admin123*

