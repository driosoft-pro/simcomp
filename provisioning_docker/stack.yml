networks:
  simcomp-public:
    driver: overlay
  simcomp-backend:
    driver: overlay

volumes:
  auth_db_data:
  personas_db_data:
  automotores_db_data:
  infracciones_db_data:
  comparendos_db_data:

configs:
  haproxy_conf_v3:
    file: haproxy/haproxy.swarm.cfg
  prometheus_conf_v2:
    file: prometheus.yml
  grafana_datasources:
    file: grafana/provisioning/datasources/datasource.yml
  grafana_dashboards_provider:
    file: grafana/dashboards/provider.yml
  grafana_dashboard_docker_v3:
    file: grafana/dashboards/json/simcomp_dashboard.json

services:

  haproxy:
    image: docker.io/deytonro/simcomp-haproxy-balance:v1.0.0
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 8404
        published: 8404
        mode: host
    networks:
      - simcomp-public
      - simcomp-backend
    configs:
      - source: haproxy_conf_v3
        target: /usr/local/etc/haproxy/haproxy.cfg
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      placement:
        constraints:
          - node.hostname == managerDocker
      restart_policy:
        condition: on-failure

  frontend:
    image: deytonro/simcomp-frontend:latest
    environment:
      VITE_API_BASE_URL: /api
      API_URL: /api
    networks:
      - simcomp-backend
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      placement:
        constraints:
          - node.hostname == managerDocker
      restart_policy:
        condition: on-failure

  ms-auth-service:
    image: deytonro/simcomp-auth-service:latest
    environment:
      PORT: 8001
      AUTH_DB_HOST: simcomp_db-auth
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: auth_db
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: auth_pass
      JWT_SECRET: supersecretkey_auth_2026
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_DAYS: 7
    networks:
      - simcomp-backend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.hostname == workerDocker1
      restart_policy:
        condition: on-failure

  ms-personas:
    image: deytonro/simcomp-personas-service:latest
    environment:
      PORT: 8002
      PERSONAS_DB_HOST: simcomp_db-personas
      PERSONAS_DB_PORT: 5432
      PERSONAS_DB_NAME: personas_db
      PERSONAS_DB_USER: personas_user
      PERSONAS_DB_PASSWORD: personas_pass
      JWT_SECRET: supersecretkey_auth_2026
    networks:
      - simcomp-backend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.hostname == workerDocker1
      restart_policy:
        condition: on-failure

  ms-automotores:
    image: deytonro/simcomp-automotores-service:latest
    environment:
      PORT: 8003
      AUTOMOTORES_DB_HOST: simcomp_db-automotores
      AUTOMOTORES_DB_PORT: 5432
      AUTOMOTORES_DB_NAME: automotores_db
      AUTOMOTORES_DB_USER: automotores_user
      AUTOMOTORES_DB_PASSWORD: automotores_pass
      JWT_SECRET: supersecretkey_auth_2026
    networks:
      - simcomp-backend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.hostname == workerDocker1
      restart_policy:
        condition: on-failure

  ms-infracciones:
    image: deytonro/simcomp-infracciones-service:latest
    environment:
      PORT: 8004
      INFRACCIONES_DB_HOST: simcomp_db-infracciones
      INFRACCIONES_DB_PORT: 5432
      INFRACCIONES_DB_NAME: infracciones_db
      INFRACCIONES_DB_USER: infracciones_user
      INFRACCIONES_DB_PASSWORD: infracciones_pass
      JWT_SECRET: supersecretkey_auth_2026
    networks:
      - simcomp-backend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.hostname == workerDocker1
      restart_policy:
        condition: on-failure

  ms-comparendos:
    image: deytonro/simcomp-comparendos-service:latest
    environment:
      PORT: 8005
      COMPARENDOS_DB_HOST: simcomp_db-comparendos
      COMPARENDOS_DB_PORT: 5432
      COMPARENDOS_DB_NAME: comparendos_db
      COMPARENDOS_DB_USER: comparendos_user
      COMPARENDOS_DB_PASSWORD: comparendos_pass
      JWT_SECRET: supersecretkey_auth_2026
    networks:
      - simcomp-backend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.hostname == workerDocker1
      restart_policy:
        condition: on-failure

  ms-reportes:
    image: deytonro/simcomp-reportes-service:latest
    environment:
      PORT: 8006
      AUTH_SERVICE_URL: http://simcomp_ms-auth-service:8001
      PERSONAS_SERVICE_URL: http://simcomp_ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://simcomp_ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://simcomp_ms-infracciones:8004
      COMPARENDOS_SERVICE_URL: http://simcomp_ms-comparendos:8005
      JWT_SECRET: supersecretkey_auth_2026
    networks:
      - simcomp-backend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.hostname == workerDocker1
      restart_policy:
        condition: on-failure

  ms-analytics-spark:
    image: deytonro/simcomp-analytics-spark:latest
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      SPARK_MASTER_URL: local[*]
      SPARK_LOCAL_IP: 0.0.0.0
    ports:
      - "8010:8010"
      - "4040:4040"
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker1
      restart_policy:
        condition: on-failure

  db-auth:
    image: deytonro/simcomp-auth-db:latest
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker2
      restart_policy:
        condition: on-failure

  db-personas:
    image: deytonro/simcomp-personas-db:latest
    environment:
      POSTGRES_USER: personas_user
      POSTGRES_PASSWORD: personas_pass
      POSTGRES_DB: personas_db
    volumes:
      - personas_db_data:/var/lib/postgresql/data
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker2
      restart_policy:
        condition: on-failure

  db-automotores:
    image: deytonro/simcomp-automotores-db:latest
    environment:
      POSTGRES_USER: automotores_user
      POSTGRES_PASSWORD: automotores_pass
      POSTGRES_DB: automotores_db
    volumes:
      - automotores_db_data:/var/lib/postgresql/data
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker2
      restart_policy:
        condition: on-failure

  db-infracciones:
    image: deytonro/simcomp-infracciones-db:latest
    environment:
      POSTGRES_USER: infracciones_user
      POSTGRES_PASSWORD: infracciones_pass
      POSTGRES_DB: infracciones_db
    volumes:
      - infracciones_db_data:/var/lib/postgresql/data
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker2
      restart_policy:
        condition: on-failure

  db-comparendos:
    image: deytonro/simcomp-comparendos-db:latest
    environment:
      POSTGRES_USER: comparendos_user
      POSTGRES_PASSWORD: comparendos_pass
      POSTGRES_DB: comparendos_db
    volumes:
      - comparendos_db_data:/var/lib/postgresql/data
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker2
      restart_policy:
        condition: on-failure

  # =====================================================================
  # OBSERVABILITY
  # =====================================================================
  glances:
    image: docker.io/nicolargo/glances:3.4.0.3
    environment:
      - GLANCES_OPT=-w --export prometheus
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - simcomp-backend
    deploy:
      mode: global
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  node-exporter:
    image: docker.io/prom/node-exporter:v1.9.0
    volumes:
      - /:/host:ro,rslave
    networks:
      - simcomp-backend
    deploy:
      mode: global

  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - simcomp-backend
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_conf_v2
        target: /etc/prometheus/prometheus.yml
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == managerDocker

  grafana:
    image: docker.io/grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    networks:
      - simcomp-backend
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: grafana_dashboard_docker_v3
        target: /etc/grafana/dashboards/docker-dashboard.json
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == managerDocker

