worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server ms-auth-service:8001;
    }

    upstream personas_service {
        server ms-personas:8002;
    }

    upstream automotores_service {
        server ms-automotores:8003;
    }

    upstream infracciones_service {
        server ms-infracciones:8004;
    }

    upstream comparendos_service {
        server ms-comparendos:8005;
    }

    upstream reportes_service {
        server ms-reportes:8006;
    }

    server {
        listen 80;
        server_name _;

        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/personas/ {
            proxy_pass http://personas_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/automotores/ {
            proxy_pass http://automotores_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/infracciones/ {
            proxy_pass http://infracciones_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/comparendos/ {
            proxy_pass http://comparendos_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/reportes/ {
            proxy_pass http://reportes_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 200 'gateway ok';
            add_header Content-Type text/plain;
        }
    }
}