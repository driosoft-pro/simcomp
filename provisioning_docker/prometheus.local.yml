global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:8404']
    metrics_path: /metrics

  - job_name: 'ms-auth-service'
    static_configs:
      - targets: ['ms-auth-service:8001']
    metrics_path: /metrics

  - job_name: 'ms-analytics-spark'
    static_configs:
      - targets: ['ms-analytics-spark:8010']
    metrics_path: /health
