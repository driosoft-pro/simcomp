# =====================================================================
# GLOBAL
# =====================================================================
global
    log stdout format raw local0
    maxconn 4096

# =====================================================================
# DEFAULTS
# =====================================================================
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# =====================================================================
# STATS
# =====================================================================
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:Admin123*
    http-request use-service prometheus-exporter if { path /metrics }

# =====================================================================
# FRONTEND PRINCIPAL
# =====================================================================
frontend http_front
    bind *:8080

    # CORS
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    http-response set-header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With"
    
    acl is_options method OPTIONS
    http-request return status 204 if is_options

    # ACLs para microservicios
    acl is_auth        path_beg /api/auth /api/login /api/usuarios
    acl is_personas    path_beg /api/personas /api/licencias
    acl is_auto        path_beg /api/automotores
    acl is_infra       path_beg /api/infracciones
    acl is_comp        path_beg /api/comparendos
    acl is_reportes    path_beg /api/reportes

    # Enrutamiento
    use_backend auth_back         if is_auth
    use_backend personas_back     if is_personas
    use_backend automotores_back  if is_auto
    use_backend infracciones_back if is_infra
    use_backend comparendos_back  if is_comp
    use_backend reportes_back     if is_reportes

    default_backend frontend_back

# =====================================================================
# BACKENDS (LOCAL COMPOSE)
# =====================================================================

backend frontend_back
    balance roundrobin
    server frontend1 frontend1:80 check

backend auth_back
    balance roundrobin
    server auth ms-auth-service:8001 check

backend personas_back
    balance roundrobin
    server personas ms-personas:8002 check

backend automotores_back
    balance roundrobin
    server automotores ms-automotores:8003 check

backend infracciones_back
    balance roundrobin
    server infracciones ms-infracciones:8004 check

backend comparendos_back
    balance roundrobin
    server comparendos ms-comparendos:8005 check

backend reportes_back
    balance roundrobin
    server reportes ms-reportes:8006 check
