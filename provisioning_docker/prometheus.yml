global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.simcomp_cadvisor'
        type: 'A'
        port: 8080

  - job_name: 'haproxy'
    dns_sd_configs:
      - names:
          - 'tasks.simcomp_haproxy'
        type: 'A'
        port: 8404
    metrics_path: /metrics

