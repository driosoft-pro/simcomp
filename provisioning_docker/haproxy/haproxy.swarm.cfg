# =====================================================================
# GLOBAL
# =====================================================================
global
    log stdout format raw local0
    maxconn 50000
    tune.ssl.default-dh-param 2048
    # Usar todos los hilos disponibles (1 por CPU virtual en las VMs)
    nbthread 2
    # Buffers de memoria optimizados para alta carga
    tune.bufsize 32768
    tune.maxrewrite 8192

# =====================================================================
# DEFAULTS
# =====================================================================
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    # http-server-close reutiliza conexiones del servidor pero cierra la del cliente
    # Cambiamos a http-keep-alive para reutilizar AMBOS lados bajo alta carga
    option  http-keep-alive
    retries 2
    timeout connect  3s
    timeout client   60s
    timeout server   60s
    timeout http-keep-alive 15s
    timeout http-request    10s
    timeout queue           30s

    # Compresión para reducir ancho de banda
    compression algo gzip
    compression type text/html text/plain text/css text/javascript application/javascript application/json

# =====================================================================
# DNS SWARM
# =====================================================================
resolvers docker_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 5
    timeout resolve 2s
    timeout retry   2s
    hold valid      30s
    hold nx         10s
    hold refused    10s
    hold timeout    10s
    accepted_payload_size 8192

# =====================================================================
# STATS (PROTEGIDO)
# =====================================================================
frontend stats_front
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:Admin123*

# =====================================================================
# FRONTEND PRINCIPAL (ENTRYPOINT ÚNICO)
# =====================================================================
frontend simcomp_front
    bind *:80

    # Rate limiting: aumentado para soportar 400+ usuarios concurrentes
    # 100 req/10s por IP = 10 req/s por usuario — razonable para tests
    stick-table type ip size 200k expire 30s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    # Descomentado: limitar solo si alguien abusa demasiado (ej: >800 req en 10s)
    # http-request deny status 429 if { sc0_http_req_rate(10s) gt 800 }

    # -----------------------------
    # CORS GLOBAL
    # -----------------------------
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    http-response set-header Access-Control-Allow-Headers "Authorization, Content-Type"
    http-response set-header Access-Control-Max-Age "3600"

    acl is_options method OPTIONS
    http-request return status 204 if is_options

    # -----------------------------
    # SEGURIDAD: Bloquear endpoints internos
    # -----------------------------
    acl path_internal    path_sub /internal/
    http-request deny if path_internal

    # -----------------------------
    # ACLs (ROUTING REAL)
    # -----------------------------
    acl path_auth        path_beg /api/auth /api/login /api/usuarios
    acl path_personas    path_beg /api/personas /api/licencias
    acl path_auto        path_beg /api/automotores
    acl path_infra       path_beg /api/infracciones
    acl path_comp        path_beg /api/comparendos
    acl path_reportes    path_beg /api/reportes

    # -----------------------------
    # ROUTING
    # -----------------------------
    use_backend auth_back         if path_auth
    use_backend personas_back     if path_personas
    use_backend automotores_back  if path_auto
    use_backend infracciones_back if path_infra
    use_backend comparendos_back  if path_comp
    use_backend reportes_back     if path_reportes

    default_backend frontend_back

# =====================================================================
# BACKENDS
# NOTA: Los servidores backup fueron ELIMINADOS porque en Swarm
# no existen esos hostnames y causaban timeouts continuos en los
# health checks, degradando el rendimiento del load balancer.
# El propio Swarm DNS garantiza alta disponibilidad de las réplicas.
# =====================================================================

backend frontend_back
    balance leastconn
    option httpchk GET /
    http-check expect status 200
    # El número en server-template debe igualar o superar las réplicas del stack
    server-template frontend 5 tasks.simcomp_frontend:80 check inter 5s rise 2 fall 3 resolvers docker_dns init-addr none

backend auth_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    # Timeout específico para auth (incluye operaciones JWT)
    timeout server 30s
    server-template auth 10 tasks.simcomp_ms-auth-service:8001 check inter 5s rise 2 fall 3 resolvers docker_dns init-addr none

backend personas_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template personas 10 tasks.simcomp_ms-personas:8002 check inter 5s rise 2 fall 3 resolvers docker_dns init-addr none

backend automotores_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template automotores 10 tasks.simcomp_ms-automotores:8003 check inter 5s rise 2 fall 3 resolvers docker_dns init-addr none

backend infracciones_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template infracciones 10 tasks.simcomp_ms-infracciones:8004 check inter 5s rise 2 fall 3 resolvers docker_dns init-addr none

backend comparendos_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server-template comparendos 10 tasks.simcomp_ms-comparendos:8005 check inter 5s rise 2 fall 3 resolvers docker_dns init-addr none

backend reportes_back
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    # Reportes puede tardar más al agregar datos de múltiples servicios
    timeout server 90s
    server-template reportes 10 tasks.simcomp_ms-reportes:8006 check inter 5s rise 2 fall 3 resolvers docker_dns init-addr none
