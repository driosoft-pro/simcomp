networks:
  public:
    driver: overlay
    attachable: true
  backend:
    driver: overlay
    attachable: true

volumes:
  auth_db_data:
  personas_db_data:
  automotores_db_data:
  infracciones_db_data:
  comparendos_db_data:

secrets:
  auth_db_pass:
    file: ./secrets/auth_db_pass.txt
  personas_db_pass:
    file: ./secrets/personas_db_pass.txt
  automotores_db_pass:
    file: ./secrets/automotores_db_pass.txt
  infracciones_db_pass:
    file: ./secrets/infracciones_db_pass.txt
  comparendos_db_pass:
    file: ./secrets/comparendos_db_pass.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret.txt

configs:
  haproxy_conf_v5:
    file: ./haproxy/haproxy.swarm.cfg
  prometheus_conf_v3:
    file: ./prometheus.yml
  grafana_datasources:
    file: ./grafana/provisioning/datasources/datasource.yml
  grafana_dashboards_provider_v5:
    file: ./grafana/dashboards/provider.yml
  grafana_dashboard_pro_v4:
    file: ./grafana/dashboards/json/simcomp_dashboard.json

services:

  haproxy:
    image: docker.io/deytonro/simcomp-haproxy-balance:v1.0.0
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 8404
        published: 8404
        mode: host
    networks:
      - public
      - backend
    configs:
      - source: haproxy_conf_v5
        target: /usr/local/etc/haproxy/haproxy.cfg
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  frontend:
    image: docker.io/deytonro/simcomp-frontend:v1.0.0
    environment:
      VITE_API_BASE_URL: /api
      API_URL: /api
    networks:
      - backend
    deploy:
      endpoint_mode: dnsrr
      replicas: 2
      placement:
        preferences:
          - spread: node.role
      restart_policy:
        condition: on-failure

  ms-auth-service:
    image: docker.io/deytonro/simcomp-auth-service:v1.0.0
    environment:
      PORT: 8001
      AUTH_DB_HOST: simcomp_db-auth
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: auth_db
      AUTH_DB_USER: auth_user
      NODE_ENV: production
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_DAYS: 7
      PERSONAS_SERVICE_URL: http://simcomp_ms-personas:8002
    secrets:
      - source: auth_db_pass
        target: auth_db_password
      - source: jwt_secret_key
        target: jwt_secret
    networks:
      - backend
    deploy:
      replicas: 4
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  ms-personas:
    image: docker.io/deytonro/simcomp-personas-service:v1.0.0
    environment:
      PORT: 8002
      PERSONAS_DB_HOST: simcomp_db-personas
      PERSONAS_DB_PORT: 5432
      PERSONAS_DB_NAME: personas_db
      PERSONAS_DB_USER: personas_user
      NODE_ENV: production
      AUTH_SERVICE_URL: http://simcomp_ms-auth-service:8001
      AUTOMOTORES_SERVICE_URL: http://simcomp_ms-automotores:8003
      COMPARENDOS_SERVICE_URL: http://simcomp_ms-comparendos:8005
      INFRACCIONES_SERVICE_URL: http://simcomp_ms-infracciones:8004
    secrets:
      - source: personas_db_pass
        target: personas_db_password
      - source: jwt_secret_key
        target: jwt_secret
    networks:
      - backend
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  ms-automotores:
    image: docker.io/deytonro/simcomp-automotores-service:v1.0.0
    environment:
      PORT: 8003
      AUTOMOTORES_DB_HOST: simcomp_db-automotores
      AUTOMOTORES_DB_PORT: 5432
      AUTOMOTORES_DB_NAME: automotores_db
      AUTOMOTORES_DB_USER: automotores_user
      NODE_ENV: production
      PERSONAS_SERVICE_URL: http://simcomp_ms-personas:8002
    secrets:
      - source: automotores_db_pass
        target: automotores_db_password
      - source: jwt_secret_key
        target: jwt_secret
    networks:
      - backend
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  ms-infracciones:
    image: docker.io/deytonro/simcomp-infracciones-service:v1.0.0
    environment:
      PORT: 8004
      INFRACCIONES_DB_HOST: simcomp_db-infracciones
      INFRACCIONES_DB_PORT: 5432
      INFRACCIONES_DB_NAME: infracciones_db
      INFRACCIONES_DB_USER: infracciones_user
      NODE_ENV: production
      PERSONAS_SERVICE_URL: http://simcomp_ms-personas:8002
    secrets:
      - source: infracciones_db_pass
        target: infracciones_db_password
      - source: jwt_secret_key
        target: jwt_secret
    networks:
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ms-comparendos:
    image: docker.io/deytonro/simcomp-comparendos-service:v1.0.0
    environment:
      PORT: 8005
      COMPARENDOS_DB_HOST: simcomp_db-comparendos
      COMPARENDOS_DB_PORT: 5432
      COMPARENDOS_DB_NAME: comparendos_db
      COMPARENDOS_DB_USER: comparendos_user
      NODE_ENV: production
      PERSONAS_SERVICE_URL: http://simcomp_ms-personas:8002
    secrets:
      - source: comparendos_db_pass
        target: comparendos_db_password
      - source: jwt_secret_key
        target: jwt_secret
    networks:
      - backend
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  ms-reportes:
    image: docker.io/deytonro/simcomp-reportes-service:v1.0.0
    environment:
      PORT: 8006
      AUTH_SERVICE_URL: http://simcomp_ms-auth-service:8001
      PERSONAS_SERVICE_URL: http://simcomp_ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://simcomp_ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://simcomp_ms-infracciones:8004
      COMPARENDOS_SERVICE_URL: http://simcomp_ms-comparendos:8005
      NODE_ENV: production
    secrets:
      - source: jwt_secret_key
        target: jwt_secret
    networks:
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ms-analytics-spark:
    image: docker.io/deytonro/simcomp-analytics-spark-service:v1.0.0
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_DAYS: 7
      SPARK_MASTER_URL: spark://spark-master:7077
    secrets:
      - source: jwt_secret_key
        target: jwt_secret
    ports:
      - "8010:8010"
      - "4040:4040"
    volumes:
      - ../analytics-spark-service/data:/app/data
      - ../analytics-spark-service/routes:/app/routes
      - ../analytics-spark-service/services:/app/services
      - ../analytics-spark-service/config.py:/app/config.py
    networks:
      backend:
        aliases:
          - ms-analytics-spark
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  spark-master:
    image: docker.io/library/spark:4.1.1-java21-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ../analytics-spark-service/data:/app/data
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      backend:
        aliases:
          - spark-master
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  spark-worker:
    image: docker.io/library/spark:4.1.1-java21-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ../analytics-spark-service/data:/app/data
    networks:
      backend:
        aliases:
          - spark-worker
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id

  db-auth:
    image: docker.io/deytonro/simcomp-auth-db:v1.0.0
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_DB: auth_db
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_password
    secrets:
      - source: auth_db_pass
        target: auth_db_password
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      backend:
        aliases:
          - db-auth
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  db-personas:
    image: docker.io/deytonro/simcomp-personas-db:v1.0.0
    environment:
      POSTGRES_USER: personas_user
      POSTGRES_DB: personas_db
      POSTGRES_PASSWORD_FILE: /run/secrets/personas_db_password
    secrets:
      - source: personas_db_pass
        target: personas_db_password
    volumes:
      - personas_db_data:/var/lib/postgresql/data
    networks:
      backend:
        aliases:
          - db-personas
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  db-automotores:
    image: docker.io/deytonro/simcomp-automotores-db:v1.0.0
    environment:
      POSTGRES_USER: automotores_user
      POSTGRES_DB: automotores_db
      POSTGRES_PASSWORD_FILE: /run/secrets/automotores_db_password
    secrets:
      - source: automotores_db_pass
        target: automotores_db_password
    volumes:
      - automotores_db_data:/var/lib/postgresql/data
    networks:
      backend:
        aliases:
          - db-automotores
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  db-infracciones:
    image: docker.io/deytonro/simcomp-infracciones-db:v1.0.0
    environment:
      POSTGRES_USER: infracciones_user
      POSTGRES_DB: infracciones_db
      POSTGRES_PASSWORD_FILE: /run/secrets/infracciones_db_password
    secrets:
      - source: infracciones_db_pass
        target: infracciones_db_password
    volumes:
      - infracciones_db_data:/var/lib/postgresql/data
    networks:
      backend:
        aliases:
          - db-infracciones
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  db-comparendos:
    image: docker.io/deytonro/simcomp-comparendos-db:v1.0.0
    environment:
      POSTGRES_USER: comparendos_user
      POSTGRES_DB: comparendos_db
      POSTGRES_PASSWORD_FILE: /run/secrets/comparendos_db_password
    secrets:
      - source: comparendos_db_pass
        target: comparendos_db_password
    volumes:
      - comparendos_db_data:/var/lib/postgresql/data
    networks:
      backend:
        aliases:
          - db-comparendos
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  glances:
    image: docker.io/nicolargo/glances:3.4.0.3
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    ports:
      - target: 61208
        published: 61208
        mode: host
    deploy:
      mode: global

  node-exporter:
    image: docker.io/prom/node-exporter:v1.9.0
    volumes:
      - /:/host:ro,rslave
    networks:
      - backend
    deploy:
      mode: global

  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - backend
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_conf_v3
        target: /etc/prometheus/prometheus.yml
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: docker.io/grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    networks:
      - backend
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboards_provider_v5
        target: /etc/grafana/provisioning/dashboards/provider.yml
      - source: grafana_dashboard_pro_v4
        target: /etc/grafana/provisioning/dashboards/json/simcomp_dashboard.json
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend
    deploy:
      mode: global
