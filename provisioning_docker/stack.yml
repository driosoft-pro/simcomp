networks:
  simcomp-public:
    driver: overlay
    attachable: true

  simcomp-backend:
    driver: overlay
    attachable: true

volumes:
  auth_db_data:
  personas_db_data:
  automotores_db_data:
  infracciones_db_data:
  comparendos_db_data:

configs:
  haproxy_cfg:
    file: ./haproxy/haproxy.cfg

services:
  haproxy:
    image: docker.io/deytonro/simcomp-haproxy-balance:v1.0.0
    ports:
      - "80:80"
      - "8404:8404"
    networks:
      - simcomp-public
      - simcomp-backend
    configs:
      - source: haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  frontend:
    image: docker.io/deytonro/simcomp-frontend:v1.0.0
    networks:
      - simcomp-public
      - simcomp-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker

  ms-auth-service:
    image: docker.io/deytonro/simcomp-auth-service:v1.0.0
    environment:
      PORT: 8001
      DB_HOST: db-auth
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: supersecret_simcomp_2026
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_DAYS: 7
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      NODE_ENV: production
    networks:
      - simcomp-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ms-personas:
    image: docker.io/deytonro/simcomp-personas-service:v1.0.0
    environment:
      PORT: 8002
      DB_HOST: db-personas
      DB_PORT: 5432
      DB_NAME: personas_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://ms-auth-service:8001
      NODE_ENV: production
    networks:
      - simcomp-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ms-automotores:
    image: docker.io/deytonro/simcomp-automotores-service:v1.0.0
    environment:
      PORT: 8003
      DB_HOST: db-automotores
      DB_PORT: 5432
      DB_NAME: automotores_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      NODE_ENV: production
    networks:
      - simcomp-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ms-infracciones:
    image: docker.io/deytonro/simcomp-infracciones-service:v1.0.0
    environment:
      PORT: 8004
      DB_HOST: db-infracciones
      DB_PORT: 5432
      DB_NAME: infracciones_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: production
    networks:
      - simcomp-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ms-comparendos:
    image: docker.io/deytonro/simcomp-comparendos-service:v1.0.0
    environment:
      PORT: 8005
      DB_HOST: db-comparendos
      DB_PORT: 5432
      DB_NAME: comparendos_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://ms-infracciones:8004
      NODE_ENV: production
    networks:
      - simcomp-backend
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  ms-reportes:
    image: docker.io/deytonro/simcomp-reportes-service:v1.0.0
    environment:
      PORT: 8006
      NODE_ENV: production
      AUTH_SERVICE_URL: http://ms-auth-service:8001
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://ms-infracciones:8004
      COMPARENDOS_SERVICE_URL: http://ms-comparendos:8005
    networks:
      - simcomp-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  db-auth:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - /vagrant/provisioning_docker/db-init/ms-auth-service_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker1

  db-personas:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: personas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - personas_db_data:/var/lib/postgresql/data
      - /vagrant/provisioning_docker/db-init/ms-personas_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker1

  db-automotores:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: automotores_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - automotores_db_data:/var/lib/postgresql/data
      - /vagrant/provisioning_docker/db-init/ms-automotores_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker1

  db-infracciones:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: infracciones_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - infracciones_db_data:/var/lib/postgresql/data
      - /vagrant/provisioning_docker/db-init/ms-infracciones_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker1

  db-comparendos:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: comparendos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - comparendos_db_data:/var/lib/postgresql/data
      - /vagrant/provisioning_docker/db-init/ms-comparendos_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - simcomp-backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == workerDocker1