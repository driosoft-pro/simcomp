services:

  # =========================
  # DATABASES
  # =========================

  db-auth:
    build: ./backend/ms-auth-service/db
    image: docker.io/deytonro/simcomp-auth-db:v1.0.0
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-personas:
    build: ./backend/ms-personas/db
    image: docker.io/deytonro/simcomp-personas-db:v1.0.0
    environment:
      POSTGRES_USER: ${PERSONAS_DB_USER}
      POSTGRES_PASSWORD: ${PERSONAS_DB_PASSWORD}
      POSTGRES_DB: ${PERSONAS_DB_NAME}
    volumes:
      - personas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PERSONAS_DB_USER} -d ${PERSONAS_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-automotores:
    build: ./backend/ms-automotores/db
    image: docker.io/deytonro/simcomp-automotores-db:v1.0.0
    environment:
      POSTGRES_USER: ${AUTOMOTORES_DB_USER}
      POSTGRES_PASSWORD: ${AUTOMOTORES_DB_PASSWORD}
      POSTGRES_DB: ${AUTOMOTORES_DB_NAME}
    volumes:
      - automotores_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTOMOTORES_DB_USER} -d ${AUTOMOTORES_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-infracciones:
    build: ./backend/ms-infracciones/db
    image: docker.io/deytonro/simcomp-infracciones-db:v1.0.0
    environment:
      POSTGRES_USER: ${INFRACCIONES_DB_USER}
      POSTGRES_PASSWORD: ${INFRACCIONES_DB_PASSWORD}
      POSTGRES_DB: ${INFRACCIONES_DB_NAME}
    volumes:
      - infracciones_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${INFRACCIONES_DB_USER} -d ${INFRACCIONES_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  db-comparendos:
    build: ./backend/ms-comparendos/db
    image: docker.io/deytonro/simcomp-comparendos-db:v1.0.0
    environment:
      POSTGRES_USER: ${COMPARENDOS_DB_USER}
      POSTGRES_PASSWORD: ${COMPARENDOS_DB_PASSWORD}
      POSTGRES_DB: ${COMPARENDOS_DB_NAME}
    volumes:
      - comparendos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${COMPARENDOS_DB_USER} -d ${COMPARENDOS_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simcomp-net

  # =========================
  # MICROSERVICIOS
  # =========================

  ms-auth-service:
    build: ./backend/ms-auth-service
    image: docker.io/deytonro/simcomp-auth-service:v1.0.0
    restart: always
    depends_on:
      db-auth:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: ms-auth-service
      PORT: 8001
      AUTH_DB_HOST: db-auth
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
      PERSONAS_SERVICE_URL: http://ms-personas:8002
    volumes:
      - ./backend/ms-auth-service/src:/app/src
    networks:
      - simcomp-net

  ms-personas:
    build: ./backend/ms-personas
    image: docker.io/deytonro/simcomp-personas-service:v1.0.0
    restart: always
    depends_on:
      db-personas:
        condition: service_healthy
    volumes:
      - ./backend/ms-personas/src:/app/src
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: ms-personas
      PORT: 8002
      PERSONAS_DB_HOST: db-personas
      PERSONAS_DB_PORT: 5432
      PERSONAS_DB_NAME: ${PERSONAS_DB_NAME}
      PERSONAS_DB_USER: ${PERSONAS_DB_USER}
      PERSONAS_DB_PASSWORD: ${PERSONAS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
      AUTH_SERVICE_URL: http://ms-auth-service:8001
      AUTOMOTORES_SERVICE_URL: http://ms-automotores:8003
      COMPARENDOS_SERVICE_URL: http://ms-comparendos:8005
    networks:
      - simcomp-net

  ms-automotores:
    build: ./backend/ms-automotores
    image: docker.io/deytonro/simcomp-automotores-service:v1.0.0
    restart: always
    depends_on:
      db-automotores:
        condition: service_healthy
      ms-personas:
        condition: service_started
    ports:
      - "8003:8003"
    environment:
      SERVICE_NAME: ms-automotores
      PORT: 8003
      AUTOMOTORES_DB_HOST: db-automotores
      AUTOMOTORES_DB_PORT: 5432
      AUTOMOTORES_DB_NAME: ${AUTOMOTORES_DB_NAME}
      AUTOMOTORES_DB_USER: ${AUTOMOTORES_DB_USER}
      AUTOMOTORES_DB_PASSWORD: ${AUTOMOTORES_DB_PASSWORD}
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
    volumes:
      - ./backend/ms-automotores/src:/app/src
    networks:
      - simcomp-net

  ms-infracciones:
    build: ./backend/ms-infracciones
    image: docker.io/deytonro/simcomp-infracciones-service:v1.0.0
    restart: always
    depends_on:
      db-infracciones:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      SERVICE_NAME: ms-infracciones
      PORT: 8004
      INFRACCIONES_DB_HOST: db-infracciones
      INFRACCIONES_DB_PORT: 5432
      INFRACCIONES_DB_NAME: ${INFRACCIONES_DB_NAME}
      INFRACCIONES_DB_USER: ${INFRACCIONES_DB_USER}
      INFRACCIONES_DB_PASSWORD: ${INFRACCIONES_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
    volumes:
      - ./backend/ms-infracciones/src:/app/src
    networks:
      - simcomp-net

  ms-comparendos:
    build: ./backend/ms-comparendos
    image: docker.io/deytonro/simcomp-comparendos-service:v1.0.0
    restart: always
    depends_on:
      db-comparendos:
        condition: service_healthy
      ms-personas:
        condition: service_started
      ms-automotores:
        condition: service_started
      ms-infracciones:
        condition: service_started
    ports:
      - "8005:8005"
    environment:
      SERVICE_NAME: ms-comparendos
      PORT: 8005
      COMPARENDOS_DB_HOST: db-comparendos
      COMPARENDOS_DB_PORT: 5432
      COMPARENDOS_DB_NAME: ${COMPARENDOS_DB_NAME}
      COMPARENDOS_DB_USER: ${COMPARENDOS_DB_USER}
      COMPARENDOS_DB_PASSWORD: ${COMPARENDOS_DB_PASSWORD}
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://ms-infracciones:8004
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
    volumes:
      - ./backend/ms-comparendos/src:/app/src
    networks:
      - simcomp-net

  ms-reportes:
    build: ./backend/ms-reportes
    image: docker.io/deytonro/simcomp-reportes-service:v1.0.0
    restart: always
    depends_on:
      ms-auth-service:
        condition: service_started
      ms-personas:
        condition: service_started
      ms-automotores:
        condition: service_started
      ms-infracciones:
        condition: service_started
      ms-comparendos:
        condition: service_started
    ports:
      - "8006:8006"
    environment:
      SERVICE_NAME: ms-reportes
      PORT: 8006
      AUTH_SERVICE_URL: http://ms-auth-service:8001
      PERSONAS_SERVICE_URL: http://ms-personas:8002
      AUTOMOTORES_SERVICE_URL: http://ms-automotores:8003
      INFRACCIONES_SERVICE_URL: http://ms-infracciones:8004
      COMPARENDOS_SERVICE_URL: http://ms-comparendos:8005
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
    volumes:
      - ./backend/ms-reportes/src:/app/src
    networks:
      - simcomp-net

  # =========================
  # LOAD BALANCER (HAPROXY)
  # =========================

  haproxy:
    build: ./provisioning_docker/haproxy
    image: docker.io/deytonro/simcomp-haproxy-balance:v1.0.0
    volumes:
      - ./provisioning_docker/haproxy/haproxy.local.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
      - "8404:8404"
    depends_on:
      - ms-auth-service
      - ms-personas
      - ms-automotores
      - ms-infracciones
      - ms-comparendos
      - ms-reportes
      - frontend1
      - frontend2
    networks:
      - simcomp-net

  # =========================
  # FRONTEND
  # =========================

  frontend1:
    build: ./frontend
    image: docker.io/deytonro/simcomp-frontend:v1.0.0
    restart: unless-stopped
    environment:
      API_URL: http://127.0.0.1:8080/api
    networks:
      - simcomp-net

  frontend2:
    build: ./frontend
    image: docker.io/deytonro/simcomp-frontend:v1.0.0
    restart: unless-stopped
    environment:
      API_URL: http://127.0.0.1:8080/api
    networks:
      - simcomp-net

  ms-analytics-spark:
    build: ./analytics-spark-service
    image: docker.io/deytonro/simcomp-analytics-spark-service:v1.0.0
    restart: always
    ports:
      - "8010:8010"
      - "4040:4040"
    environment:
      SERVICE_NAME: ms-analytics-spark
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
      SPARK_MASTER_URL: local[*]
      SPARK_LOCAL_IP: 0.0.0.0
    volumes:
      - ./analytics-spark-service/data:/app/data
    networks:
      - simcomp-net

  # =====================================================================
  # OBSERVABILITY
  # =====================================================================

  glances:
    image: docker.io/nicolargo/glances:3.4.0.3
    container_name: simcomp-glances
    environment:
      - GLANCES_OPT=-w
    ports:
      - "61208:61208"
      - "61209:61209"
    networks:
      - simcomp-net

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.0
    container_name: simcomp-node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"
    networks:
      - simcomp-net

  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    container_name: simcomp-prometheus
    volumes:
      - ./provisioning_docker/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - simcomp-net

  grafana:
    image: docker.io/grafana/grafana:11.5.1
    container_name: simcomp-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning_docker/grafana/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./provisioning_docker/grafana/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./provisioning_docker/grafana/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3000:3000"
    networks:
      - simcomp-net

networks:
  simcomp-net:
    driver: bridge

volumes:
  auth_db_data:
  personas_db_data:
  automotores_db_data:
  infracciones_db_data:
  comparendos_db_data:
  prometheus_data:
  grafana_data:
